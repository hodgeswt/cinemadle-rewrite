name: Frontend Unit Tests
on:
  push:
    branches:
      - 'main'
    paths:
      - 'frontend/**'
      - '.github/workflows/FrontendUnitTests.yml'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'frontend/**'
      - '.github/workflows/FrontendUnitTests.yml'
  workflow_dispatch:

concurrency:
  group: frontend-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.9.x'

      - name: Run unit tests
        run: deno test
